services:
  open-simple-mail:
    build:
      context: .
      # .env (gitignored) may set APT_MIRROR=mirrors.ustc.edu.cn so plain
      # `docker compose up -d --build` does not crawl against deb.debian.org.
      args:
        APT_MIRROR: ${APT_MIRROR:-}
    image: open-simple-mail:latest
    container_name: open-simple-mail
    restart: unless-stopped
    ports:
      - "22026:4000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      # The image and the port mapping are fixed to 4000; .env may set a
      # different PORT for local `npm run dev`.
      PORT: 4000
      # SQLite and the attachment scratch tree share this directory, so the
      # single bind mount below carries everything that has to survive.
      DATABASE_PATH: /app/data/open-simple-mail.db
      ATTACHMENT_DIR: /app/data/attachments
    volumes:
      # A host directory instead of a named volume: back it up with cp/rsync,
      # inspect data/attachments, and `docker compose down` never deletes it.
      # The entrypoint fixes ownership of ./data on first start (see
      # docker-entrypoint.sh); override `user:` only if you chown it yourself.
      - ./data:/app/data
