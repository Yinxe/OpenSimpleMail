<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>夜读台 · OpenSimpleMail</title>
<style>
  :root{
    --bg:#0F1114; --rail:#0A0C0E; --list:#14171B; --hover:#191D23; --selected:#1D2228;
    --surface:#1B2026; --ink:#E8E5DE; --ink-2:#B0ABA2; --ink-3:#959087;
    --line:#23272D; --line-2:#2E333A;
    --amber:#E0A458; --amber-soft:rgba(224,164,88,.13);
    --paper:#F6F0E2;
    --sans:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    --mono:"JetBrains Mono",ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:var(--sans);font-size:14px;line-height:1.5;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
  .ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

  .app{display:grid;grid-template-columns:64px 420px minmax(0,1fr);height:100vh;overflow:hidden}

  /* icon rail */
  .rail{background:var(--rail);border-right:1px solid #1A1E23;display:flex;flex-direction:column;align-items:center;padding:16px 0 14px;gap:6px}
  .rail .mark{width:26px;height:26px;color:var(--ink);margin-bottom:10px}
  .rail-btn{position:relative;display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:10px;color:var(--ink-3)}
  .rail-btn:hover{background:var(--hover);color:var(--ink)}
  .rail-btn.is-active{background:#1C2128;color:var(--ink)}
  .rail .compose{display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:11px;background:var(--amber);color:#17130D;margin-bottom:10px;box-shadow:0 6px 16px rgba(224,164,88,.18)}
  .rail .compose .ic{width:18px;height:18px;stroke-width:1.9}
  .rail .grow{flex:1}
  .rail .avatar{width:30px;height:30px;border-radius:50%;background:#2A3038;color:#CFC8BB;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;margin-top:6px}
  .rail .divider{width:24px;height:1px;background:#1E2329;margin:6px 0}

  /* list */
  .list{background:var(--list);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  .list-head{padding:20px 18px 0;display:flex;align-items:flex-start;gap:8px}
  .list-head h1{margin:0;font-size:20px;font-weight:600;letter-spacing:-.01em;line-height:1.3}
  .list-head p{margin:4px 0 0;font-size:12px;color:var(--ink-3)}
  .list-head p b{color:var(--ink-2);font-weight:600}
  .icon-btn{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:8px;color:var(--ink-3)}
  .icon-btn:hover{background:var(--hover);color:var(--ink)}
  .list-head .icon-btn{margin-left:auto}

  .search{display:flex;align-items:center;gap:8px;height:32px;margin:14px 18px 12px;padding:0 10px;border:1px solid var(--line-2);border-radius:8px;background:#181C21}
  .search .ic{width:14px;height:14px;color:var(--ink-3)}
  .search input{flex:1;min-width:0;border:0;outline:0;background:none;font:inherit;font-size:12.5px;color:var(--ink)}
  .search input::placeholder{color:var(--ink-3)}
  .search kbd{font-family:var(--mono);font-size:10px;color:var(--ink-3);border:1px solid var(--line-2);border-radius:4px;padding:1px 5px}

  .rows{flex:1;overflow-y:auto;min-height:0}
  .row{display:grid;grid-template-columns:12px minmax(0,1fr);gap:8px;width:100%;padding:9px 16px 10px 14px;text-align:left;border-bottom:1px solid #1B1F25}
  .row:hover{background:var(--hover)}
  .row.is-selected{background:#232A32;box-shadow:inset 0 0 0 1px #39424C}
  .row .mark{width:6px;height:6px;border-radius:50%;margin-top:9px;background:transparent}
  .row.is-unread .mark{background:var(--amber)}
  .row .l1{display:flex;align-items:baseline;gap:8px;min-width:0}
  .sender{font-size:12.5px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row.is-unread .sender{color:var(--ink-2)}
  .date{margin-left:auto;flex:none;font-family:var(--mono);font-size:12px;letter-spacing:.02em;color:var(--ink-3)}
  .subject{display:block;margin-top:1px;font-size:14px;font-weight:500;line-height:1.4;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row.is-unread .subject{color:var(--ink);font-weight:600}
  .preview{display:block;margin-top:1px;font-size:13px;line-height:1.45;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .star{color:var(--amber);display:inline-flex;vertical-align:-1px;margin-left:5px}
  .star .ic{width:12px;height:12px;fill:currentColor;stroke:currentColor}
  .paperclip{color:var(--ink-3);display:inline-flex;vertical-align:-2px;margin-left:5px}
  .paperclip .ic{width:12px;height:12px}
  .acct{display:inline-block;width:4px;height:4px;border-radius:50%;background:#6E8A7E;margin-right:6px;vertical-align:1px}

  .list-foot{display:flex;align-items:center;justify-content:space-between;padding:7px 18px;border-top:1px solid var(--line);font-size:11px;color:var(--ink-3)}
  .list-foot .pager{display:flex;gap:1px}

  /* reader */
  .reader{position:relative;background:var(--bg);display:flex;flex-direction:column;min-width:0;min-height:0}
  .reader::before{content:"";position:absolute;inset:0 0 auto;height:280px;background:radial-gradient(560px 220px at 50% 0,rgba(224,164,88,.09),transparent 72%);pointer-events:none}
  .reader-bar{position:relative;display:flex;align-items:center;gap:2px;height:52px;padding:0 12px;border-bottom:1px solid #1B1F25;flex:none}
  .reader-bar .sep{width:1px;height:16px;background:var(--line-2);margin:0 6px}
  .reader-bar .spacer{flex:1}
  .reader-bar .label{font-size:11px;color:var(--ink-3);margin-right:2px}
  .reader-scroll{position:relative;flex:1;overflow-y:auto;min-height:0;padding:18px 26px 24px;display:flex;flex-direction:column}
  .sheet{flex:1;max-width:760px;width:100%;margin:0 auto;display:flex;flex-direction:column;background:var(--paper);border-radius:8px;box-shadow:0 26px 64px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.07);padding:36px 46px 28px}
  .sheet h2{margin:0;font-size:25px;line-height:1.4;font-weight:600;letter-spacing:-.012em;color:#1B1A17;overflow-wrap:anywhere}
  .meta{display:flex;align-items:flex-start;gap:10px;margin-top:16px;padding-bottom:16px;border-bottom:1px solid #E7E0D2}
  .avatar{width:34px;height:34px;border-radius:50%;background:#EDE6D7;color:#6B5F4B;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:600;flex:none}
  .meta .who{flex:1;min-width:0}
  .meta .from{font-size:13px;font-weight:600;color:#2A2823}
  .meta .addr{font-size:11.5px;color:#6F695F;margin-left:4px}
  .meta .to{margin-top:2px;font-size:11px;color:#6F695F}
  .meta time{flex:none;font-family:var(--mono);font-size:10.5px;color:#6F695F;padding-top:3px}
  .body{margin-top:20px;font-size:15px;line-height:1.78;color:#2A2823}
  .body p{margin:0 0 14px}
  .body p:last-child{margin-bottom:0}
  .attach{display:flex;align-items:center;gap:10px;margin-top:22px;padding:9px 11px;border:1px solid #E7E0D2;border-radius:8px;background:#F7F2E7}
  .attach .file{width:30px;height:30px;border-radius:7px;background:#EDE6D7;color:#7A5C2C;display:flex;align-items:center;justify-content:center;flex:none}
  .attach .info{display:flex;flex-direction:column;line-height:1.35;min-width:0}
  .attach .info b{font-size:12.5px;font-weight:600;color:#2A2823}
  .attach .info small{font-size:10.5px;color:#6F695F}
  .attach .icon-btn{margin-left:auto;color:#6F695F}
  .reply{display:flex;align-items:center;gap:8px;margin-top:26px;padding-top:18px;border-top:1px solid #E7E0D2}
  .reply .field{flex:1;height:40px;display:flex;align-items:center;padding:0 14px;border:1px solid #DCD3C1;border-radius:8px;background:#F7F2E7;color:#6F695F;font-size:13px}
  .send{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 15px;border-radius:8px;background:var(--amber);color:#1A1509;font-size:13px;font-weight:600}
  .send .ic{width:15px;height:15px}

  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:#2C3138;border:2px solid transparent;background-clip:content-box;border-radius:99px}
  ::-webkit-scrollbar-track{background:transparent}
</style>
</head>

          <div class="who">
            <div><span class="from">王小明</span><span class="addr">&lt;xiaoming@studio.example&gt;</span></div>

        <div class="body">
          <p>早上好，</p>
